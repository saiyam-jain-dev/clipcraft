# Netlify configuration for ClipCraft Frontend
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Redirect API calls to the backend server
# Replace YOUR_BACKEND_URL with your deployed backend URL (e.g., https://clipcraft-api.railway.app)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/video/*"
  to = "https://YOUR_BACKEND_URL/video/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://YOUR_BACKEND_URL/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/download/*"
  to = "https://YOUR_BACKEND_URL/download/:splat"
  status = 200
  force = true

# SPA fallback for Next.js App Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for CORS and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/media/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/download/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"